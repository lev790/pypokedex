[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypokedex"
version = "1.0.0"
description = "A lightweight Python helper library for Pokémon data."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "PyPokedex contributors"}]
keywords = ["pokemon", "pokedex", "pokeapi", "games"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "License :: OSI Approved :: MIT License",
]

[tool.setuptools]
packages = ["pypokedex"]
